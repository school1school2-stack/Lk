<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحلل الزمني | أبو نواف 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.0/dist/Adhan.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --accent: #fbbf24;
            --bg: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #f8fafc;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 10px;
        }

        .top-bar {
            width: 100%; max-width: 600px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px; border-radius: 24px;
            margin-bottom: 20px; text-align: center; backdrop-filter: blur(10px);
        }

        .time { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: var(--secondary); display: block; }
        
        .prayer-countdown {
            margin-top: 10px; padding: 12px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 15px; color: var(--accent);
            font-size: 1.1rem; font-weight: bold;
        }

        .date-info { font-size: 0.85rem; color: #94a3b8; margin-top: 10px; line-height: 1.5; }

        .container {
            width: 100%; max-width: 500px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 { text-align: center; margin-bottom: 20px; font-size: 1.4rem; color: var(--secondary); }

        .section-label { font-size: 0.8rem; color: #94a3b8; margin: 12px 0 6px; display: block; }

        .toggle-group {
            display: flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 4px; margin-bottom: 15px;
        }
        .toggle-group input { display: none; }
        .toggle-group label {
            flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 9px; transition: 0.3s; font-size: 0.85rem;
        }
        input:checked + label { background: var(--primary); color: white; }

        .dropdown-row { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 8px; }
        select {
            padding: 12px; border-radius: 10px; border: 1px solid #334155;
            background: #1e293b; color: white; font-family: 'Cairo'; font-size: 0.85rem; outline: none;
        }

        .calc-btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none; margin-top: 20px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s;
        }

        .results { margin-top: 20px; display: none; animation: fadeIn 0.5s ease; }
        .res-card {
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; margin-bottom: 10px;
            border-right: 4px solid var(--secondary);
        }
        .res-card p { font-size: 1.1rem; font-weight: bold; }

        footer { text-align: center; font-size: 1rem; color: #64748b; padding: 20px; width: 100%; }
        .name-tag { font-weight: bold; background: linear-gradient(to left, #818cf8, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="top-bar">
    <span class="time" id="liveClock">00:00:00</span>
    
    <div class="prayer-countdown" id="prayerTimer">
        <i class="fa-solid fa-sync fa-spin"></i> جاري المزامنة مع الرياض...
    </div>

    <div class="date-info" id="liveDate"></div>
</div>

<div class="container">
    <h1><i class="fa-solid fa-clock-rotate-left"></i> المحلل الزمني الذكي</h1>

    <span class="section-label">1. نوع التقويم:</span>
    <div class="toggle-group">
        <input type="radio" name="cal" id="miladi" value="g" checked onchange="initDateDropdowns()">
        <label for="miladi">ميلادي</label>
        <input type="radio" name="cal" id="hijri" value="h" onchange="initDateDropdowns()">
        <label for="hijri">هجري</label>
    </div>

    <span class="section-label">2. المطلوب حسابه:</span>
    <div class="toggle-group">
        <input type="radio" name="mode" id="modeAge" value="age" checked>
        <label for="modeAge">حساب العمر</label>
        <input type="radio" name="mode" id="modeTarget" value="target">
        <label for="modeTarget">المتبقي للتاريخ</label>
    </div>

    <span class="section-label">3. اختر التاريخ:</span>
    <div class="dropdown-row">
        <select id="day"></select>
        <select id="month"></select>
        <select id="year"></select>
    </div>

    <button class="calc-btn" onclick="execute()">تحليل البيانات</button>

    <div class="results" id="resBox">
        <div class="res-card"><h4>التاريخ المقابل</h4><p id="valConv">-</p></div>
        <div class="res-card" style="border-right-color: #22c55e;"><h4>النتيجة التحليلية</h4><p id="valMain">-</p></div>
    </div>
</div>

<footer>تم التطوير بواسطة <span class="name-tag">أبو نواف 2026</span></footer>

<script>
    function updateLiveStuff() {
        const now = new Date();
        const mNow = moment(now);
        
        document.getElementById('liveClock').innerText = mNow.format('hh:mm:ss A');
        document.getElementById('liveDate').innerHTML = `${mNow.format('iDD iMMMM iYYYY')} هـ | ${mNow.format('DD MMMM YYYY')} م`;

        // إعدادات الرياض الدقيقة (أم القرى)
        const coords = new adhan.Coordinates(24.7136, 46.6753); // الرياض
        const params = adhan.CalculationMethod.UmmAlQura();
        params.madhab = adhan.Madhab.Shafi; // المذهب المعتمد في أم القرى للعصر

        const prayerTimes = new adhan.PrayerTimes(coords, now, params);
        
        const list = [
            { name: "الفجر", t: prayerTimes.fajr },
            { name: "الظهر", t: prayerTimes.dhuhr },
            { name: "العصر", t: prayerTimes.asr },
            { name: "المغرب", t: prayerTimes.maghrib },
            { name: "العشاء", t: prayerTimes.isha }
        ];

        let nextP = list.find(p => p.t > now);

        if (!nextP) {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tTimes = new adhan.PrayerTimes(coords, tomorrow, params);
            nextP = { name: "الفجر", t: tTimes.fajr };
        }

        const diff = nextP.t - now;
        const duration = moment.duration(diff);
        
        const h = String(Math.floor(duration.asHours())).padStart(2, '0');
        const m = String(duration.minutes()).padStart(2, '0');
        const s = String(duration.seconds()).padStart(2, '0');

        document.getElementById('prayerTimer').innerHTML = 
            `<i class="fa-solid fa-person-praying"></i> المتبقي لصلاة <b>${nextP.name}</b>: ${h}:${m}:${s}`;
    }

    setInterval(updateLiveStuff, 1000);

    function initDateDropdowns() {
        const isH = document.getElementById('hijri').checked;
        const dSelect = document.getElementById('day');
        const mSelect = document.getElementById('month');
        const ySelect = document.getElementById('year');

        dSelect.innerHTML = "";
        for(let i=1; i<=31; i++) dSelect.innerHTML += `<option value="${i}">${i}</option>`;

        mSelect.innerHTML = "";
        const mNames = isH ? ["محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"] : ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        mNames.forEach((m, idx) => { mSelect.innerHTML += `<option value="${idx + 1}">${m}</option>`; });

        ySelect.innerHTML = "";
        const currentY = isH ? moment().iYear() : moment().year();
        for(let i=currentY+30; i>=1350; i--) { ySelect.innerHTML += `<option value="${i}" ${i === currentY ? 'selected' : ''}>${i}</option>`; }
    }

    function execute() {
        const isH = document.getElementById('hijri').checked;
        const isAgeMode = document.getElementById('modeAge').checked;
        const d = document.getElementById('day').value;
        const m = document.getElementById('month').value;
        const y = document.getElementById('year').value;

        let mDate = isH ? moment(`${y}/${m}/${d}`, 'iYYYY/iM/iD') : moment(`${y}-${m}-${d}`, 'YYYY-M-D');
        if(!mDate.isValid()) return alert("التاريخ غير صحيح!");

        const now = moment();
        document.getElementById('valConv').innerText = isH ? mDate.format('YYYY-MM-DD') + " ميلادي" : mDate.format('iYYYY/iMM/iDD') + " هجري";

        let start = isAgeMode ? mDate : now;
        let end = isAgeMode ? now : mDate;

        if (isAgeMode && mDate.isAfter(now)) {
            document.getElementById('valMain').innerText = "التاريخ في المستقبل!";
        } else if (!isAgeMode && mDate.isBefore(now)) {
            document.getElementById('valMain').innerText = "التاريخ قد مضى!";
        } else {
            let temp = start.clone();
            const yy = end.diff(temp, 'years'); temp.add(yy, 'years');
            const mm = end.diff(temp, 'months'); temp.add(mm, 'months');
            const dd = end.diff(temp, 'days');
            document.getElementById('valMain').innerText = `${yy} سنة و ${mm} شهر و ${dd} يوم`;
        }
        document.getElementById('resBox').style.display = 'block';
    }

    window.onload = () => { initDateDropdowns(); updateLiveStuff(); };
</script>

</body>
</html>
