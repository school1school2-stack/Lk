<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحلل الزمني | أبو نواف 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.0/dist/Adhan.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #4f46e5; --secondary: #06b6d4; --accent: #fbbf24; --bg: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        .top-bar { width: 100%; max-width: 600px; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 24px; margin-bottom: 20px; text-align: center; backdrop-filter: blur(15px); }
        .time { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: var(--secondary); display: block; }
        .prayer-countdown { margin-top: 10px; padding: 12px; background: rgba(251, 191, 36, 0.1); border: 1px solid var(--accent); border-radius: 15px; color: var(--accent); font-size: 1.1rem; font-weight: bold; }
        .container { width: 100%; max-width: 500px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 25px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .toggle-group { display: flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .toggle-group input { display: none; }
        .toggle-group label { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 9px; font-size: 0.85rem; }
        input:checked + label { background: var(--primary); color: white; }
        .dropdown-row { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 8px; margin-top: 10px; }
        select { padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: white; font-family: 'Cairo'; outline: none; }
        .calc-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; margin-top: 25px; background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; font-weight: bold; cursor: pointer; }
        .results { margin-top: 25px; display: none; }
        .res-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 12px; border-right: 5px solid var(--secondary); }
        footer { margin-top: 20px; padding: 20px; text-align: center; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="top-bar">
    <span class="time" id="liveClock">00:00:00</span>
    <div class="prayer-countdown" id="prayerTimer">جاري الحساب...</div>
    <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 5px;"><i class="fa-solid fa-location-dot"></i> الرياض - تقويم أم القرى</div>
    <div id="liveDate" style="margin-top: 10px; font-size: 0.9rem; color: #94a3b8;"></div>
</div>

<div class="container">
    <h2 style="text-align: center; margin-bottom: 20px; font-size: 1.3rem; color: var(--secondary);">حاسبة الوقت والعمر</h2>
    <div class="toggle-group">
        <input type="radio" name="cal" id="miladi" checked onchange="initDateDropdowns()"><label for="miladi">ميلادي</label>
        <input type="radio" name="cal" id="hijri" onchange="initDateDropdowns()"><label for="hijri">هجري</label>
    </div>
    <div class="toggle-group">
        <input type="radio" name="mode" id="modeAge" checked onchange="initDateDropdowns()"><label for="modeAge">حساب العمر</label>
        <input type="radio" name="mode" id="modeTarget" onchange="initDateDropdowns()"><label for="modeTarget">المتبقي للتاريخ</label>
    </div>
    <div class="dropdown-row"><select id="day"></select><select id="month"></select><select id="year"></select></div>
    <button class="calc-btn" onclick="execute()">احسب الآن</button>
    <div class="results" id="resBox">
        <div class="res-card"><h4>التاريخ المقابل</h4><p id="valConv">-</p></div>
        <div class="res-card"><h4>النتيجة</h4><p id="valMain">-</p></div>
    </div>
</div>

<footer>تم التطوير بواسطة <span style="color:var(--secondary); font-weight:bold;">أبو نواف 2026</span></footer>

<script>
    function updateClock() {
        // 1. الحصول على الوقت الحالي
        const now = new Date();
        const m = moment(now);
        document.getElementById('liveClock').innerText = m.format('hh:mm:ss A');
        document.getElementById('liveDate').innerText = `${m.format('iDD iMMMM iYYYY')} هـ | ${m.format('DD MMMM YYYY')} م`;

        // 2. إحداثيات الرياض لتقويم أم القرى
        const coords = new adhan.Coordinates(24.7136, 46.6753);
        const params = adhan.CalculationMethod.UmmAlQura();
        params.madhab = adhan.Madhab.Shafi; // العصر حسب المذهب الشافعي (المتبع في السعودية)

        // 3. حساب المواقيت
        const prayerTimes = new adhan.PrayerTimes(coords, now, params);

        const list = [
            { name: "الفجر", t: prayerTimes.fajr },
            { name: "الظهر", t: prayerTimes.dhuhr },
            { name: "العصر", t: prayerTimes.asr },
            { name: "المغرب", t: prayerTimes.maghrib },
            { name: "العشاء", t: prayerTimes.isha }
        ];

        // 4. إيجاد الصلاة القادمة
        let next = list.find(p => p.t > now);
        if (!next) {
            const tom = new Date(); tom.setDate(tom.getDate() + 1);
            const tTimes = new adhan.PrayerTimes(coords, tom, params);
            next = { name: "الفجر", t: tTimes.fajr };
        }

        // 5. حساب المتبقي
        const diff = next.t - now;
        const dur = moment.duration(diff);
        const h = String(Math.floor(dur.asHours())).padStart(2, '0');
        const mn = String(dur.minutes()).padStart(2, '0');
        const s = String(dur.seconds()).padStart(2, '0');

        document.getElementById('prayerTimer').innerHTML = `صلاة <b>${next.name}</b> بعد: ${h}:${mn}:${s}`;
    }

    setInterval(updateClock, 1000);

    function initDateDropdowns() {
        const isH = document.getElementById('hijri').checked, isT = document.getElementById('modeTarget').checked;
        const d = document.getElementById('day'), m = document.getElementById('month'), y = document.getElementById('year');
        d.innerHTML = Array.from({length: 31}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('');
        const months = isH ? ["محرم", "صفر", "ربيع 1", "ربيع 2", "جمادى 1", "جمادى 2", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"] : ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        m.innerHTML = months.map((n, i) => `<option value="${i+1}">${n}</option>`).join('');
        const curY = isH ? moment().iYear() : moment().year();
        y.innerHTML = "";
        if (isT) { for (let i = curY; i <= curY + 30; i++) y.innerHTML += `<option value="${i}">${i}</option>`; }
        else { for (let i = curY; i >= curY - 100; i--) y.innerHTML += `<option value="${i}">${i}</option>`; }
    }

    function execute() {
        const isH = document.getElementById('hijri').checked, isA = document.getElementById('modeAge').checked;
        const day = document.getElementById('day').value, mon = document.getElementById('month').value, yr = document.getElementById('year').value;
        let t = isH ? moment(`${yr}/${mon}/${day}`, 'iYYYY/iM/iD') : moment(`${yr}-${mon}-${day}`, 'YYYY-MM-DD');
        if (!t.isValid()) return alert("تاريخ غير صحيح");
        document.getElementById('valConv').innerText = isH ? t.format('YYYY-MM-DD م') : t.format('iYYYY/iMM/iDD هـ');
        let s = isA ? t : moment(), e = isA ? moment() : t;
        let tmp = s.clone();
        let yy = e.diff(tmp, 'years'); tmp.add(yy, 'years');
        let mm = e.diff(tmp, 'months'); tmp.add(mm, 'months');
        let dd = e.diff(tmp, 'days');
        document.getElementById('valMain').innerText = `${yy} سنة، ${mm} شهر، ${dd} يوم`;
        document.getElementById('resBox').style.display = 'block';
    }

    window.onload = () => { initDateDropdowns(); updateClock(); };
</script>
</body>
</html>
