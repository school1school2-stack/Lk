<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحلل الزمني الاحترافي | أبو نواف</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --accent: #f43f5e;
            --bg: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #f8fafc;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px;
        }

        .container {
            width: 100%; max-width: 500px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 { text-align: center; margin-bottom: 25px; font-size: 1.6rem; color: var(--secondary); text-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }

        .section-label { font-size: 0.85rem; color: #94a3b8; margin: 15px 0 8px; display: block; }

        /* أزرار الاختيار */
        .toggle-group {
            display: flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 4px; margin-bottom: 10px;
        }
        .toggle-group input { display: none; }
        .toggle-group label {
            flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 9px; transition: 0.3s; font-size: 0.9rem;
        }
        input:checked + label { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        input[type="date"], input[type="text"] {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155;
            background: #1e293b; color: white; text-align: center; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--secondary); }

        .calc-btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none; margin-top: 20px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .calc-btn:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 10px 20px rgba(79, 102, 229, 0.3); }

        /* النتائج */
        .results { margin-top: 25px; display: none; animation: slideUp 0.5s ease; }
        .res-card {
            background: rgba(255,255,255,0.03); padding: 18px; border-radius: 15px; margin-bottom: 12px;
            border-right: 4px solid var(--secondary);
        }
        .res-card h4 { font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
        .res-card p { font-size: 1.2rem; font-weight: bold; color: #fff; }

        footer {
            text-align: center; font-size: 0.95rem; color: #64748b;
            padding: 15px; border-top: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 500px;
        }
        .name-tag { font-weight: bold; background: linear-gradient(to left, #818cf8, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-clock"></i> المحلل الزمني الذكي</h1>

    <span class="section-label">1. نوع التقويم:</span>
    <div class="toggle-group">
        <input type="radio" name="cal" id="miladi" value="g" checked onchange="toggleUI()">
        <label for="miladi">ميلادي</label>
        <input type="radio" name="cal" id="hijri" value="h" onchange="toggleUI()">
        <label for="hijri">هجري</label>
    </div>

    <span class="section-label">2. المطلوب حسابه:</span>
    <div class="toggle-group">
        <input type="radio" name="mode" id="modeAge" value="age" checked>
        <label for="modeAge">حساب العمر</label>
        <input type="radio" name="mode" id="modeTarget" value="target">
        <label for="modeTarget">المتبقي للتاريخ</label>
    </div>

    <span class="section-label">3. أدخل التاريخ:</span>
    <div id="inputArea">
        <input type="date" id="dateVal">
    </div>

    <button class="calc-btn" onclick="execute()">تحليل البيانات</button>

    <div class="results" id="resBox">
        <div class="res-card">
            <h4 id="labelConv">التاريخ المقابل</h4>
            <p id="valConv">-</p>
        </div>
        <div class="res-card" style="border-right-color: #22c55e;">
            <h4 id="labelMain">النتيجة التحليلية</h4>
            <p id="valMain">-</p>
        </div>
    </div>
</div>

<footer>
    تم التطوير بواسطة <span class="name-tag">أبو نواف 2026</span>
</footer>

<script>
    function toggleUI() {
        const isH = document.getElementById('hijri').checked;
        document.getElementById('inputArea').innerHTML = isH ? 
            `<input type="text" id="dateVal" placeholder="مثال: 1447/05/20">` : 
            `<input type="date" id="dateVal">`;
    }

    function execute() {
        const isH = document.getElementById('hijri').checked;
        const isAgeMode = document.getElementById('modeAge').checked;
        const rawVal = document.getElementById('dateVal').value;
        
        if(!rawVal) return alert("يرجى إدخال التاريخ");

        let mDate = isH ? moment(rawVal, 'iYYYY/iMM/iDD') : moment(rawVal);
        if(!mDate.isValid()) return alert("صيغة التاريخ غير صحيحة");

        const now = moment();
        
        // عرض التاريخ المقابل
        document.getElementById('valConv').innerText = isH ? 
            mDate.format('YYYY-MM-DD') + " ميلادي" : 
            mDate.format('iYYYY/iMM/iDD') + " هجري";

        if (isAgeMode) {
            // منطق حساب العمر
            if (mDate.isAfter(now)) {
                document.getElementById('valMain').innerText = "عذراً، التاريخ في المستقبل!";
            } else {
                const y = now.diff(mDate, 'years');
                const m = now.diff(mDate.clone().add(y, 'years'), 'months');
                const d = now.diff(mDate.clone().add(y, 'years').add(m, 'months'), 'days');
                document.getElementById('valMain').innerText = `${y} سنة، ${m} شهر، ${d} يوم`;
            }
            document.getElementById('labelMain').innerText = "العمر الحالي:";
        } else {
            // منطق المتبقي حتى التاريخ
            if (mDate.isBefore(now)) {
                document.getElementById('valMain').innerText = "عذراً، هذا التاريخ قد مضى!";
            } else {
                const y = mDate.diff(now, 'years');
                const m = mDate.diff(now.clone().add(y, 'years'), 'months');
                const d = mDate.diff(now.clone().add(y, 'years').add(m, 'months'), 'days');
                document.getElementById('valMain').innerText = `${y} سنة، ${m} شهر، ${d} يوم`;
            }
            document.getElementById('labelMain').innerText = "الوقت المتبقي:";
        }

        document.getElementById('resBox').style.display = 'block';
    }
</script>

</body>
</html>
