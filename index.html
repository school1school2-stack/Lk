<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحلل الزمني | أبو نواف 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.0/dist/Adhan.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --accent: #fbbf24;
            --bg: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #f8fafc;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 10px;
        }

        .top-bar {
            width: 100%; max-width: 600px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 24px;
            margin-bottom: 20px; text-align: center; backdrop-filter: blur(15px);
        }

        .time { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: var(--secondary); display: block; margin-bottom: 5px; }
        
        .prayer-countdown {
            margin-top: 10px; padding: 12px;
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 15px; color: var(--accent);
            font-size: 1.1rem; font-weight: bold;
        }

        .location-badge {
            font-size: 0.75rem; color: #94a3b8; margin-top: 8px; cursor: pointer;
            text-decoration: underline; display: inline-block;
        }

        .container {
            width: 100%; max-width: 500px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .toggle-group {
            display: flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 4px; margin-bottom: 20px;
        }
        .toggle-group input { display: none; }
        .toggle-group label {
            flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 9px; font-size: 0.9rem; transition: 0.3s;
        }
        input:checked + label { background: var(--primary); color: white; }

        .dropdown-row { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 8px; margin-top: 10px; }
        select {
            padding: 12px; border-radius: 10px; border: 1px solid #334155;
            background: #1e293b; color: white; font-family: 'Cairo'; outline: none;
        }

        .calc-btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none; margin-top: 25px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; font-weight: bold; cursor: pointer; font-size: 1.1rem;
        }

        .results { margin-top: 25px; display: none; }
        .res-card {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 12px;
            border-right: 5px solid var(--secondary);
        }

        footer { margin-top: 20px; padding: 20px; text-align: center; color: #64748b; width: 100%; }
        .name-tag { font-weight: bold; color: var(--secondary); }
    </style>
</head>
<body>

<div class="top-bar">
    <span class="time" id="liveClock">00:00:00</span>
    <div class="prayer-countdown" id="prayerTimer">جاري تحديد الموقع...</div>
    <div id="locStatus" class="location-badge" onclick="getLocation()">
        <i class="fa-solid fa-location-dot"></i> اضغط هنا لتفعيل الموقع بدقة
    </div>
    <div class="date-info" id="liveDate" style="margin-top: 10px; font-size: 0.9rem; color: #94a3b8;"></div>
</div>

<div class="container">
    <h1 style="text-align: center; margin-bottom: 20px; font-size: 1.4rem; color: var(--secondary);">حاسبة الوقت والعمر</h1>

    <div class="toggle-group">
        <input type="radio" name="cal" id="miladi" checked onchange="initDateDropdowns()">
        <label for="miladi">ميلادي</label>
        <input type="radio" name="cal" id="hijri" onchange="initDateDropdowns()">
        <label for="hijri">هجري</label>
    </div>

    <div class="toggle-group">
        <input type="radio" name="mode" id="modeAge" checked onchange="initDateDropdowns()">
        <label for="modeAge">حساب العمر</label>
        <input type="radio" name="mode" id="modeTarget" onchange="initDateDropdowns()">
        <label for="modeTarget">المتبقي للتاريخ</label>
    </div>

    <div class="dropdown-row">
        <select id="day"></select>
        <select id="month"></select>
        <select id="year"></select>
    </div>

    <button class="calc-btn" onclick="execute()">احسب الآن</button>

    <div class="results" id="resBox">
        <div class="res-card"><h4>التاريخ المقابل</h4><p id="valConv">-</p></div>
        <div class="res-card"><h4>النتيجة بالتفصيل</h4><p id="valMain">-</p></div>
    </div>
</div>

<footer>تم التطوير بواسطة <span class="name-tag">أبو نواف 2026</span></footer>

<script>
    // إحداثيات افتراضية (الرياض) حتى يتم التفعيل
    let userCoords = { lat: 24.7136, lng: 46.6753 };
    let cityLabel = "الرياض (افتراضي)";

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userCoords.lat = position.coords.latitude;
                userCoords.lng = position.coords.longitude;
                cityLabel = "موقعك الحالي";
                document.getElementById('locStatus').innerHTML = `<i class="fa-solid fa-check-circle"></i> تم تفعيل الموقع بنجاح`;
                updateLiveUI();
            }, () => {
                alert("تعذر الوصول للموقع، سيتم استخدام توقيت الرياض.");
            });
        }
    }

    function updateLiveUI() {
        const now = new Date();
        const mNow = moment(now);
        document.getElementById('liveClock').innerText = mNow.format('hh:mm:ss A');
        document.getElementById('liveDate').innerText = `${mNow.format('iDD iMMMM iYYYY')} هـ | ${mNow.format('DD MMMM YYYY')} م`;

        // حساب الأذان بناءً على الموقع الحالي
        const coords = new adhan.Coordinates(userCoords.lat, userCoords.lng);
        const params = adhan.CalculationMethod.UmmAlQura();
        params.madhab = adhan.Madhab.Shafi;
        const prayerTimes = new adhan.PrayerTimes(coords, now, params);

        const list = [
            { name: "الفجر", t: prayerTimes.fajr },
            { name: "الظهر", t: prayerTimes.dhuhr },
            { name: "العصر", t: prayerTimes.asr },
            { name: "المغرب", t: prayerTimes.maghrib },
            { name: "العشاء", t: prayerTimes.isha }
        ];

        let next = list.find(p => p.t > now);
        if (!next) {
            const tom = new Date(); tom.setDate(tom.getDate() + 1);
            const tTimes = new adhan.PrayerTimes(coords, tom, params);
            next = { name: "الفجر", t: tTimes.fajr };
        }

        let diff = next.t - now;
        let duration = moment.duration(diff);
        let h = String(Math.floor(duration.asHours())).padStart(2, '0');
        let m = String(duration.minutes()).padStart(2, '0');
        let s = String(duration.seconds()).padStart(2, '0');

        document.getElementById('prayerTimer').innerHTML = `<i class="fa-solid fa-mosque"></i> صلاة <b>${next.name}</b> بعد: ${h}:${m}:${s}`;
    }

    setInterval(updateLiveUI, 1000);

    function initDateDropdowns() {
        const isH = document.getElementById('hijri').checked;
        const isTarget = document.getElementById('modeTarget').checked;
        const d = document.getElementById('day'), m = document.getElementById('month'), y = document.getElementById('year');
        d.innerHTML = Array.from({length: 31}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('');
        const months = isH ? ["محرم", "صفر", "ربيع 1", "ربيع 2", "جمادى 1", "جمادى 2", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"] : ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        m.innerHTML = months.map((name, i) => `<option value="${i+1}">${name}</option>`).join('');
        const curY = isH ? moment().iYear() : moment().year();
        y.innerHTML = "";
        if (isTarget) {
            for (let i = curY; i <= curY + 30; i++) y.innerHTML += `<option value="${i}">${i}</option>`;
        } else {
            for (let i = curY; i >= curY - 100; i--) y.innerHTML += `<option value="${i}">${i}</option>`;
        }
    }

    function execute() {
        const isH = document.getElementById('hijri').checked, isAge = document.getElementById('modeAge').checked;
        const day = document.getElementById('day').value, month = document.getElementById('month').value, year = document.getElementById('year').value;
        let target = isH ? moment(`${year}/${month}/${day}`, 'iYYYY/iM/iD') : moment(`${year}-${month}-${day}`, 'YYYY-MM-DD');
        if (!target.isValid()) return alert("تاريخ غير صحيح");
        const now = moment();
        document.getElementById('valConv').innerText = isH ? target.format('YYYY-MM-DD م') : target.format('iYYYY/iMM/iDD هـ');
        let start = isAge ? target : now, end = isAge ? now : target;
        if (isAge && target.isAfter(now)) return alert("التاريخ في المستقبل!");
        if (!isAge && target.isBefore(now)) return alert("التاريخ قد مضى!");
        let temp = start.clone();
        let yy = end.diff(temp, 'years'); temp.add(yy, 'years');
        let mm = end.diff(temp, 'months'); temp.add(mm, 'months');
        let dd = end.diff(temp, 'days');
        document.getElementById('valMain').innerText = `${yy} سنة، ${mm} شهر، ${dd} يوم`;
        document.getElementById('resBox').style.display = 'block';
    }

    window.onload = () => { initDateDropdowns(); updateLiveUI(); };
</script>
</body>
</html>
