<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحلل الزمني الاحترافي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark-bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: #f8fafc;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }

        .main-wrapper {
            width: 100%; max-width: 550px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        h1 { text-align: center; margin-bottom: 25px; font-size: 1.8rem; color: var(--primary); }

        .input-box {
            background: rgba(0,0,0,0.2);
            padding: 20px; border-radius: 15px; margin-bottom: 20px;
        }

        label { display: block; margin-bottom: 10px; font-size: 0.9rem; color: #94a3b8; }
        input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
            background: #1e293b; color: white; margin-bottom: 15px; font-size: 1rem;
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            padding: 12px; border-radius: 10px; border: none; font-weight: bold;
            cursor: pointer; transition: 0.3s; color: white;
        }
        .btn-age { background: var(--primary); }
        .btn-target { background: var(--secondary); }
        button:hover { opacity: 0.8; transform: translateY(-2px); }

        .result-area {
            margin-top: 25px; display: none;
            animation: slideUp 0.5s ease;
        }

        .info-card {
            background: rgba(255,255,255,0.03);
            padding: 15px; border-radius: 12px; margin-bottom: 10px;
            border-right: 4px solid var(--primary);
        }
        .target-mode { border-right-color: var(--secondary); }

        .big-text { display: block; font-size: 1.3rem; font-weight: 700; color: #fff; margin-top: 5px; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <h1><i class="fa-solid fa-clock-rotate-left"></i> المحلل الزمني</h1>

    <div class="input-box">
        <label>اختر التاريخ المراد تحليله:</label>
        <input type="date" id="mainDate">
        
        <div class="btn-group">
            <button class="btn-age" onclick="analyze('age')">احسب عمري</button>
            <button class="btn-target" onclick="analyze('target')">كم باقي على؟</button>
        </div>
    </div>

    <div class="result-area" id="resultArea">
        </div>
</div>

<script>
    function analyze(type) {
        const dateInput = document.getElementById('mainDate').value;
        const resultArea = document.getElementById('resultArea');
        
        if (!dateInput) {
            alert("لطفاً، اختر التاريخ أولاً");
            return;
        }

        const selectedDate = moment(dateInput);
        const now = moment();
        let html = "";

        if (type === 'age') {
            // حساب العمر
            const years = now.diff(selectedDate, 'years');
            const months = now.diff(selectedDate.clone().add(years, 'years'), 'months');
            const days = now.diff(selectedDate.clone().add(years, 'years').add(months, 'months'), 'days');
            const hijri = moment(dateInput).format('iYYYY/iMM/iDD');

            html = `
                <div class="info-card">
                    <label>عمرك الآن بالتفصيل:</label>
                    <span class="big-text">${years} سنة، ${months} شهر، ${days} يوم</span>
                </div>
                <div class="info-card">
                    <label>تاريخ ميلادك بالهجري:</label>
                    <span class="big-text">${hijri} هـ</span>
                </div>
            `;
        } else {
            // حساب المتبقي (كم باقي على)
            if (selectedDate.isBefore(now)) {
                alert("هذا التاريخ قد مضى! استخدم زر 'احسب عمري' للتواريخ القديمة.");
                return;
            }

            const diffYears = selectedDate.diff(now, 'years');
            const diffMonths = selectedDate.diff(now.clone().add(diffYears, 'years'), 'months');
            const diffDays = selectedDate.diff(now.clone().add(diffYears, 'years').add(diffMonths, 'months'), 'days');
            const totalDays = selectedDate.diff(now, 'days');

            html = `
                <div class="info-card target-mode">
                    <label>الوقت المتبقي حتى التاريخ المحدد:</label>
                    <span class="big-text">${diffYears} سنة، ${diffMonths} شهر، ${diffDays} يوم</span>
                </div>
                <div class="info-card target-mode">
                    <label>إجمالي الأيام المتبقية:</label>
                    <span class="big-text">${totalDays} يوم تقريباً</span>
                </div>
            `;
        }

        resultArea.innerHTML = html;
        resultArea.style.display = 'block';
    }
</script>

</body>
</html>
